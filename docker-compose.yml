services:
  # ─── Infrastructure ─────────────────────────────────

  mongodb:
    image: mongo:7
    container_name: onebear-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: onebear-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: onebear-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: onebear-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  # ─── Backend ────────────────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: src/OneBear.API/Dockerfile
    container_name: onebear-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MongoDb=mongodb://mongodb:27017
      - MongoDb__DatabaseName=OneBear
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672
      - Azure__BlobStorage__ConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1
      - Azure__SignalR__ConnectionString=
      - Authentication__Authority=https://auth-nonprod.gofive.co.th/auth/realms/onebear-dev
      - Authentication__Audience=account
      - Authentication__RequireHttpsMetadata=false
      - Keycloak__AdminBaseUrl=https://auth-nonprod.gofive.co.th/auth/admin/realms/onebear-dev
      - Keycloak__TokenUrl=https://auth-nonprod.gofive.co.th/auth/realms/onebear-dev/protocol/openid-connect/token
      - Keycloak__ClientId=onebear-api
      - Keycloak__ClientSecret=${KEYCLOAK_CLIENT_SECRET:-}
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=http://localhost:3000
      - Cors__AllowedOrigins__2=http://localhost:80
      - ApiKeys__Primary=dev-webhook-key-change-in-production
      - ApiKeys__AiService=dev-ai-key-change-in-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles: ["app", "full"]

  worker:
    build:
      context: ./backend
      dockerfile: src/OneBear.Worker/Dockerfile
    container_name: onebear-worker
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://mongodb:27017
      - MongoDb__DatabaseName=OneBear
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672
      - AiService__BaseUrl=${AI_SERVICE_BASE_URL:-}
      - AiService__ApiKey=${AI_SERVICE_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles: ["app", "full"]

  # ─── Frontend ───────────────────────────────────────

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_BASE_URL=
        - VITE_KEYCLOAK_URL=https://auth-nonprod.gofive.co.th/auth/realms/onebear-dev
        - VITE_KEYCLOAK_CLIENT_ID=onebear-spa
        - VITE_REDIRECT_URI=http://localhost:3000/auth/callback
        - VITE_POST_LOGOUT_REDIRECT_URI=http://localhost:3000
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://api:8080}
    container_name: onebear-web
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    profiles: ["full"]

volumes:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  azurite-data:
