services:
  # ─── Infrastructure ─────────────────────────────────

  # Cosmos DB Emulator ไม่รองรับ ARM64 (Apple Silicon)
  # ใช้ MongoDB-compatible mode ผ่าน Azure Cosmos DB emulator for ARM
  # หรือเชื่อมต่อ Azure Cosmos DB จริง / ใช้ CosmosDB ผ่าน dotnet run local แทน
  #
  # สำหรับ dev บน Mac M-series: รัน backend ด้วย dotnet run โดยตรง
  # มันจะเชื่อมต่อ Cosmos DB ตาม connection string ใน appsettings.Development.json
  # ถ้าไม่มี Cosmos DB จะ fallback ใช้ in-memory (ดู Program.cs)

  redis:
    image: redis:7-alpine
    container_name: onebear-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: onebear-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: onebear-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  # ─── Application ────────────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: src/OneBear.API/Dockerfile
    container_name: onebear-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__CosmosDb=AccountEndpoint=https://cosmosdb:8081;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672
      - Azure__BlobStorage__ConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1
      - Azure__SignalR__ConnectionString=
      - Authentication__DevSigningKey=OneBear-Dev-Signing-Key-Min-32-Chars!!
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=http://localhost:5174
      - ApiKeys__Primary=dev-webhook-key-change-in-production
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles: ["app"]

  worker:
    build:
      context: ./backend
      dockerfile: src/OneBear.Worker/Dockerfile
    container_name: onebear-worker
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__CosmosDb=AccountEndpoint=https://cosmosdb:8081;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles: ["app"]

volumes:
  redis-data:
  rabbitmq-data:
  azurite-data:
