<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onebear — Chat Menu</title>
<style>
@font-face{font-family:'Gofive';src:url('assets/fonts/Gofive-Text.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Gofive';src:url('assets/fonts/Gofive-Medium.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'Gofive';src:url('assets/fonts/Gofive-Semi Bold.otf') format('opentype');font-weight:600;font-display:swap}
@font-face{font-family:'Gofive';src:url('assets/fonts/Gofive-Bold.otf') format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:'Sarabun';src:url('assets/fonts/Sarabun-Regular.ttf') format('truetype');font-weight:400;font-display:swap}

/* ── TOKENS ─────────────────────────────────────────── */
:root{
  --ob-font:'Gofive','Sarabun',system-ui,sans-serif;
  --r-sm:.375rem;--r-md:.5rem;--r-lg:.75rem;--r-xl:1rem;--r-2xl:1.25rem;--r-full:9999px;
  --tr-fast:150ms cubic-bezier(.4,0,.2,1);--tr-norm:250ms cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg-app:#0A0A10;--bg-page:#12121A;--bg-card:#18181F;--bg-input:#1E1E2C;
  --bg-hover:rgba(255,255,255,.04);--bg-active:rgba(3,157,145,.1);
  --t1:#F2F2FA;--t2:#9898BC;--t3:#7272A0;
  --border:rgba(255,255,255,.06);--border-in:rgba(255,255,255,.09);
  --primary:#039D91;--primary-light:#04D4C6;--primary-alpha:rgba(3,157,145,.14);--primary-glow:rgba(3,157,145,.38);
  --success:#34D399;--success-bg:rgba(52,211,153,.12);
  --warning:#FBBF24;--warning-bg:rgba(251,191,36,.12);
  --error:#F87171;--error-bg:rgba(248,113,113,.12);
  --info:#60A5FA;--info-bg:rgba(96,165,250,.12);
  --sh-sm:0 1px 4px rgba(0,0,0,.4);--sh-md:0 4px 12px rgba(0,0,0,.5);
  --scrollbar:rgba(255,255,255,.08);
}
[data-theme="light"]{
  --bg-app:#EEF0F5;--bg-page:#FFFFFF;--bg-card:#FFFFFF;--bg-input:#F0F1F5;
  --bg-hover:rgba(0,0,0,.03);--bg-active:rgba(3,157,145,.07);
  --t1:#0D0D1A;--t2:#44485A;--t3:#626878;
  --border:rgba(0,0,0,.07);--border-in:rgba(0,0,0,.09);
  --primary:#039D91;--primary-light:#04D4C6;--primary-alpha:rgba(3,157,145,.10);--primary-glow:rgba(3,157,145,.22);
  --success:#10B981;--success-bg:#D1FAE5;
  --warning:#F59E0B;--warning-bg:#FEF3C7;
  --error:#EF4444;--error-bg:#FEE2E2;
  --info:#3B82F6;--info-bg:#DBEAFE;
  --sh-sm:0 1px 4px rgba(15,23,42,.07);--sh-md:0 4px 12px rgba(15,23,42,.1);
  --scrollbar:rgba(0,0,0,.1);
}

/* ── RESET + BASE ─────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--ob-font);background:var(--bg-app);color:var(--t1);font-size:14px;transition:background .35s,color .35s}
button{font-family:inherit;cursor:pointer;border:none;background:none;outline:none}
input,textarea,select{font-family:inherit;outline:none;border:none}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:2px}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 var(--primary-glow)}50%{box-shadow:0 0 0 4px rgba(3,157,145,0)}}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}

/* ── LAYOUT ───────────────────────────────────────── */
.layout{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ──────────────────────────────────────── */
.sidebar{width:62px;background:var(--bg-app);display:flex;flex-direction:column;align-items:center;padding:16px 0 20px;flex-shrink:0;border-right:1px solid var(--border);z-index:20;transition:background .35s}
.sb-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--primary-light),var(--primary));border-radius:var(--r-xl);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;margin-bottom:22px;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 4px 20px var(--primary-glow);flex-shrink:0}
.sb-nav{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 11px}
.sbi{width:40px;height:40px;border-radius:var(--r-xl);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);transition:all var(--tr-fast);position:relative}
.sbi:hover{background:var(--bg-hover);color:var(--t2)}
.sbi.on{background:var(--primary-alpha);color:var(--primary)}
.sbi.on::before{content:'';position:absolute;left:-11px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--primary)}
.sbi svg{width:17px;height:17px}
.sbi .pip{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--primary);border:1.5px solid var(--bg-app);animation:pulse-dot 2.5s ease-in-out infinite}
.sb-gap{flex:1}
.sb-user{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer;position:relative;box-shadow:0 0 0 2.5px rgba(167,139,250,.3)}
.sb-user::after{content:'';position:absolute;bottom:1px;right:1px;width:8px;height:8px;border-radius:50%;background:var(--success);border:1.5px solid var(--bg-app)}

/* ── CHAT LIST PANEL ──────────────────────────────── */
.chat-panel{width:300px;flex-shrink:0;background:var(--bg-page);display:flex;flex-direction:column;border-right:1px solid var(--border);transition:background .35s}
.cp-head{padding:16px 14px 10px;flex-shrink:0}
.cp-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cp-title{font-size:1.1rem;font-weight:800;color:var(--t1);letter-spacing:-.5px}
.cp-head-btns{display:flex;gap:4px}
.icon-btn{width:30px;height:30px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;color:var(--t3);transition:all var(--tr-fast)}
.icon-btn:hover{background:var(--bg-hover);color:var(--t1)}
.icon-btn.active{background:var(--primary-alpha);color:var(--primary)}
.icon-btn svg{width:15px;height:15px}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--bg-input);border:1.5px solid var(--border-in);border-radius:var(--r-xl);padding:8px 12px;transition:all .2s}
.search-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-alpha)}
.search-wrap svg{width:13px;height:13px;color:var(--t3);flex-shrink:0}
.search-wrap input{flex:1;background:none;font-size:.8125rem;color:var(--t1);min-width:0}
.search-wrap input::placeholder{color:var(--t3)}
.search-clear{color:var(--t3);line-height:1;display:none;font-size:14px;padding:0 2px}
.search-clear.show{display:block}

/* Status Tabs */
.status-tabs{display:flex;padding:8px 14px 0;gap:0;overflow-x:auto;flex-shrink:0}
.status-tabs::-webkit-scrollbar{display:none}
.stab{padding:7px 10px;font-size:.75rem;font-weight:500;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all var(--tr-fast);display:flex;align-items:center;gap:5px}
.stab:hover{color:var(--t2)}
.stab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.stab-count{font-size:.6875rem;font-weight:700;background:var(--bg-input);color:var(--t3);padding:1px 5px;border-radius:var(--r-full);min-width:18px;text-align:center}
.stab.on .stab-count{background:var(--primary-alpha);color:var(--primary)}
.tab-divider{height:1px;background:var(--border);margin:0 0 4px;flex-shrink:0}

/* Filter Drawer */
.filter-drawer{background:var(--bg-input);border-bottom:1px solid var(--border);padding:0;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease;flex-shrink:0}
.filter-drawer.open{max-height:320px;padding:12px 14px}
.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.filter-row.single{grid-template-columns:1fr}
.filter-field label{display:block;font-size:.6875rem;font-weight:600;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.filter-field input,.filter-field select{width:100%;background:var(--bg-page);border:1.5px solid var(--border-in);border-radius:var(--r-md);padding:7px 10px;font-size:.8125rem;color:var(--t1);transition:border-color .2s}
.filter-field input:focus,.filter-field select:focus{border-color:var(--primary)}
.filter-field select option{background:var(--bg-card);color:var(--t1)}
.filter-tags-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.filter-tag{padding:3px 8px;border-radius:var(--r-full);font-size:.6875rem;font-weight:600;background:var(--bg-page);border:1.5px solid var(--border-in);color:var(--t2);cursor:pointer;transition:all var(--tr-fast)}
.filter-tag.sel{background:var(--primary-alpha);border-color:var(--primary);color:var(--primary)}
.filter-actions{display:flex;gap:8px;margin-top:10px}
.btn-filter-apply{flex:1;padding:7px;background:var(--primary);color:#fff;border-radius:var(--r-md);font-size:.8125rem;font-weight:600}
.btn-filter-clear{padding:7px 14px;background:var(--bg-page);border:1.5px solid var(--border-in);color:var(--t2);border-radius:var(--r-md);font-size:.8125rem}

/* Chat List */
.chat-list{flex:1;overflow-y:auto;padding:4px 0}
.ci-divider{display:flex;align-items:center;gap:8px;padding:8px 14px 4px;font-size:.6875rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.ci-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.ci{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;cursor:pointer;border-radius:var(--r-2xl);margin:1px 6px;transition:all var(--tr-fast);position:relative;animation:fadeIn .2s}
.ci:hover{background:var(--bg-hover)}
.ci.on{background:var(--bg-active)}
.ci.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:28px;border-radius:0 3px 3px 0;background:var(--primary)}
.ci.pinned .ci-name::before{content:'📌';font-size:10px;margin-right:3px}

/* Avatar */
.ci-av-wrap{position:relative;flex-shrink:0}
.ci-av{width:44px;height:44px;border-radius:var(--r-2xl);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff}
.av-p{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.av-o{background:linear-gradient(135deg,#fb923c,#dc2626)}
.av-g{background:linear-gradient(135deg,#34d399,#059669)}
.av-r{background:linear-gradient(135deg,#f472b6,#db2777)}
.av-b{background:linear-gradient(135deg,#60a5fa,#2563eb)}
.av-t{background:linear-gradient(135deg,#2dd4bf,#0891b2)}
.ci-plt{position:absolute;bottom:-2px;right:-2px;width:17px;height:17px;border-radius:50%;border:2px solid var(--bg-page);display:flex;align-items:center;justify-content:center;transition:border-color .35s}
.plt-line{background:#06C755}
.plt-fb{background:#1877F2}
.plt-ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.plt-web{background:#3B82F6}
.ci-plt svg{width:7px;height:7px;fill:#fff}
.ci-done-ring{position:absolute;top:-2px;left:-2px;width:48px;height:48px;border-radius:calc(var(--r-2xl) + 2px);border:2px solid var(--success);opacity:.7}

/* Chat item content */
.ci-content{flex:1;min-width:0}
.ci-row1{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:3px}
.ci-name{font-size:.875rem;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ci-badges{display:flex;align-items:center;gap:3px;flex-shrink:0}
.ci-src{font-size:.5625rem;font-weight:700;background:var(--bg-input);color:var(--t3);padding:1px 5px;border-radius:3px;letter-spacing:.02em}
.ci-ico{font-size:10px;line-height:1;opacity:.7}
.ci-time{font-size:.6875rem;color:var(--t3);flex-shrink:0;white-space:nowrap}
.ci-row2{display:flex;align-items:center;gap:6px;justify-content:space-between}
.ci-preview{font-size:.8125rem;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ci-preview.unread{color:var(--t1);font-weight:600}
.ci-typing{display:flex;align-items:center;gap:3px;height:16px}
.ci-typing span{width:5px;height:5px;border-radius:50%;background:var(--primary);display:block}
.ci-typing span:nth-child(1){animation:typing 1.2s .0s infinite}
.ci-typing span:nth-child(2){animation:typing 1.2s .2s infinite}
.ci-typing span:nth-child(3){animation:typing 1.2s .4s infinite}
.ci-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ci-owners{display:flex;align-items:center}
.ci-ow{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;border:1.5px solid var(--bg-page);margin-left:-4px;transition:border-color .35s}
.ci-ow:first-child{margin-left:0}
.ci-ow.ow-k{background:linear-gradient(135deg,var(--primary-light),var(--primary))}
.ci-ow.ow-w{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.ci-ow.ow-a{background:linear-gradient(135deg,#fb923c,#dc2626)}
.ci-ow.ow-more{background:var(--bg-input);color:var(--t3);font-size:6px}
.ci-unread{min-width:18px;height:18px;border-radius:var(--r-full);background:var(--primary);color:#fff;font-size:.5625rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.ci-done-ico{width:16px;height:16px;border-radius:50%;background:var(--success-bg);display:flex;align-items:center;justify-content:center}
.ci-done-ico svg{width:10px;height:10px;stroke:var(--success)}

/* Status badge chip on item */
.ci-status{font-size:.5625rem;font-weight:700;padding:2px 6px;border-radius:var(--r-full);letter-spacing:.04em;flex-shrink:0}
.st-unassigned{background:rgba(114,114,160,.15);color:var(--t3)}
.st-new{background:var(--info-bg);color:var(--info)}
.st-inprogress{background:var(--warning-bg);color:var(--warning)}
.st-done{background:var(--success-bg);color:var(--success)}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:10px;color:var(--t3)}
.empty-state svg{width:40px;height:40px;opacity:.4}
.empty-state p{font-size:.875rem;text-align:center}

/* ── CHAT MAIN ────────────────────────────────────── */
.chat-main{flex:1;display:flex;flex-direction:column;background:var(--bg-card);min-width:0;transition:background .35s}
.chat-hdr{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(var(--bg-card),.95);backdrop-filter:blur(12px)}
.hdr-av-wrap{position:relative;flex-shrink:0}
.hdr-av{width:38px;height:38px;border-radius:var(--r-xl);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.hdr-plt{position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bg-card);display:flex;align-items:center;justify-content:center;transition:border-color .35s}
.hdr-plt svg{width:6px;height:6px;fill:#fff}
.hdr-info{flex:1;min-width:0}
.hdr-name{font-size:.9375rem;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-status{font-size:.625rem;font-weight:700;padding:2px 7px;border-radius:var(--r-full)}
.hdr-sub{font-size:.75rem;color:var(--t3);margin-top:1px}
.hdr-actions{display:flex;align-items:center;gap:4px}
.hdr-btn{width:32px;height:32px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;color:var(--t3);transition:all var(--tr-fast)}
.hdr-btn:hover{background:var(--bg-hover);color:var(--t1)}
.hdr-btn svg{width:16px;height:16px}
.done-btn{padding:0 14px;height:32px;border-radius:var(--r-full);background:var(--success-bg);color:var(--success);font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:6px;transition:all var(--tr-fast)}
.done-btn:hover{background:var(--success);color:#fff}
.done-btn svg{width:14px;height:14px}
.reopen-btn{padding:0 14px;height:32px;border-radius:var(--r-full);background:var(--bg-input);color:var(--t2);font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:6px;transition:all var(--tr-fast)}
.reopen-btn:hover{background:var(--border-in);color:var(--t1)}

/* Messages */
.msgs-area{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.date-sep{text-align:center;margin:10px 0;font-size:.6875rem;color:var(--t3);display:flex;align-items:center;gap:10px}
.date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.sys-msg{text-align:center;font-size:.6875rem;color:var(--t3);padding:4px 12px;background:var(--bg-input);border-radius:var(--r-full);align-self:center}
/* Message rows */
.mr{display:flex;align-items:flex-end;gap:8px;max-width:75%}
.mr.from-them{align-self:flex-start}
.mr.from-us{align-self:flex-end;flex-direction:row-reverse}
.mr-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;align-self:flex-end}
.mr-body{display:flex;flex-direction:column;gap:2px}
.mr.from-us .mr-body{align-items:flex-end}
.mb{background:var(--bg-input);color:var(--t1);padding:10px 13px;border-radius:16px 16px 16px 4px;font-size:.875rem;line-height:1.55;word-break:break-word;max-width:320px}
.mr.from-us .mb{background:var(--primary);color:#fff;border-radius:16px 16px 4px 16px}
.mt{font-size:.625rem;color:var(--t3);padding:0 4px;margin-top:2px}
/* Image grid */
.msg-imgs{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:12px;overflow:hidden;max-width:240px}
.msg-imgs.single{grid-template-columns:1fr;max-width:200px}
.msg-imgs.odd .img-item:last-child{grid-column:1/-1}
.img-item{aspect-ratio:1;background:var(--bg-input);overflow:hidden;cursor:pointer;position:relative}
.img-item img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.img-item:hover img{transform:scale(1.04)}
.img-item.placeholder{display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:24px}
/* Reply bubble */
.reply-ref{background:var(--primary-alpha);border-left:3px solid var(--primary);padding:6px 10px;border-radius:0 8px 8px 0;margin-bottom:4px;font-size:.75rem;color:var(--t2);cursor:pointer}
.reply-ref strong{display:block;color:var(--primary);font-size:.6875rem;margin-bottom:2px}
/* File attachment */
.file-bubble{display:flex;align-items:center;gap:10px;background:var(--bg-input);padding:10px 13px;border-radius:12px;max-width:240px;cursor:pointer;transition:background var(--tr-fast)}
.file-bubble:hover{background:var(--border-in)}
.file-ico{width:36px;height:36px;border-radius:var(--r-lg);background:var(--primary-alpha);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-ico svg{width:18px;height:18px;stroke:var(--primary)}
.file-info{min-width:0}
.file-name{font-size:.8125rem;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.file-size{font-size:.6875rem;color:var(--t3);margin-top:1px}
/* Voice message */
.voice-bubble{display:flex;align-items:center;gap:10px;background:var(--bg-input);padding:10px 13px;border-radius:22px;min-width:180px;max-width:240px}
.mr.from-us .voice-bubble{background:var(--primary)}
.voice-play{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:12px}
.mr.from-us .voice-play{background:rgba(255,255,255,.25)}
.voice-wave{flex:1;height:28px;display:flex;align-items:center;gap:2px}
.voice-wave span{display:block;width:3px;background:var(--primary-alpha);border-radius:2px;flex-shrink:0}
.mr.from-us .voice-wave span{background:rgba(255,255,255,.3)}
.voice-dur{font-size:.6875rem;color:var(--t3)}

.sticker{font-size:48px;line-height:1;user-select:none}
/* Emoji only */

/* Read receipt */

/* Input area */
.input-area{flex-shrink:0;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg-card);transition:background .35s}
.input-row{display:flex;gap:10px;align-items:flex-end}
.input-wrap{flex:1;background:var(--bg-input);border:1.5px solid var(--border-in);border-radius:var(--r-xl);transition:all .2s;min-height:44px;display:flex;flex-direction:column}

.input-tools{display:flex;gap:2px;padding:8px 10px 0}
.tb{width:28px;height:28px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:var(--t3);transition:all var(--tr-fast)}
.tb:hover{background:var(--bg-hover);color:var(--t1)}

.msg-ta{flex:1;background:none;color:var(--t1);font-size:.875rem;padding:6px 12px 10px;resize:none;line-height:1.5;max-height:120px;overflow-y:auto}

.send-btn{width:44px;height:44px;border-radius:var(--r-xl);background:linear-gradient(135deg,var(--primary-light),var(--primary));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 10px var(--primary-alpha);transition:all var(--tr-norm)}

/* ── RIGHT PANEL ──────────────────────────────────── */
.right-panel{width:320px;flex-shrink:0;background:var(--bg-page);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:background .35s;animation:slideIn .25s}

.rp-av-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.rp-av{width:52px;height:52px;border-radius:var(--r-2xl);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;flex-shrink:0;position:relative}
.rp-av-plt{position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:50%;border:2px solid var(--bg-page);display:flex;align-items:center;justify-content:center;transition:border-color .35s}
.rp-av-plt svg{width:8px;height:8px;fill:#fff}
.rp-cust-info{flex:1;min-width:0}
.rp-cust-name{font-size:1rem;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rp-original-name{font-size:.75rem;color:var(--t3);margin-top:2px;font-style:italic}
.rp-profile-btn{width:28px;height:28px;border-radius:var(--r-md);background:var(--bg-input);display:flex;align-items:center;justify-content:center;color:var(--t3);flex-shrink:0;transition:all var(--tr-fast)}
.rp-profile-btn:hover{background:var(--primary-alpha);color:var(--primary)}
.rp-profile-btn svg{width:14px;height:14px}
.rp-status-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rp-platform-chip{display:flex;align-items:center;gap:4px;font-size:.6875rem;color:var(--t3);background:var(--bg-input);padding:3px 8px;border-radius:var(--r-full)}
.rp-platform-chip svg{width:10px;height:10px}
/* Action buttons */
.rp-actions{display:flex;gap:6px;padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.rp-act{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:var(--r-lg);background:var(--bg-input);color:var(--t2);font-size:.6875rem;font-weight:600;transition:all var(--tr-fast);cursor:pointer}

.sec-title button{color:var(--t3);font-size:.6875rem;text-transform:none;letter-spacing:0;font-weight:600;transition:color var(--tr-fast)}
.sec-title button:hover{color:var(--primary)}
/* Form fields in right panel */
.rp-field{margin-bottom:10px}
.rp-field label{display:block;font-size:.6875rem;color:var(--t3);margin-bottom:4px;font-weight:500}
.rp-field input,.rp-field select,.rp-field textarea{width:100%;background:var(--bg-input);border:1.5px solid var(--border-in);border-radius:var(--r-md);padding:8px 10px;font-size:.8125rem;color:var(--t1);transition:border-color .2s}
.rp-field input:focus,.rp-field select:focus,.rp-field textarea:focus{border-color:var(--primary)}
.rp-field textarea{resize:none;min-height:72px;line-height:1.5}
.rp-field select option{background:var(--bg-card);color:var(--t1)}
.rp-field .add-link{font-size:.8125rem;color:var(--t3);cursor:pointer;transition:color var(--tr-fast)}
.rp-field .add-link:hover{color:var(--primary)}
.rp-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* Tags */
.tags-wrap{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:4px 10px;border-radius:var(--r-full);font-size:.75rem;font-weight:600;background:var(--primary-alpha);color:var(--primary);border:1px solid rgba(3,157,145,.2);cursor:default;display:flex;align-items:center;gap:4px}
.tag .tag-x{color:var(--primary);opacity:.6;cursor:pointer;font-size:12px;line-height:1}
.tag.add-tag{background:var(--bg-input);color:var(--t3);border-color:var(--border-in);cursor:pointer}
.tag.add-tag:hover{border-color:var(--primary);color:var(--primary)}

.owners-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.owner-chip .ow-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff}
.owner-chip .ow-x{color:var(--t3);cursor:pointer;font-size:13px;line-height:1;margin-left:2px}
.owner-chip .ow-x:hover{color:var(--error)}
.add-owner-btn{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-full);background:var(--bg-input);border:1.5px dashed var(--border-in);color:var(--t3);font-size:.75rem;cursor:pointer;transition:all var(--tr-fast)}
.add-owner-btn:hover{border-color:var(--primary);color:var(--primary)}
/* Private note */
.private-note{background:var(--warning-bg);border:1px solid rgba(251,191,36,.2);border-radius:var(--r-lg);padding:10px 12px}
.private-note label{font-size:.6875rem;font-weight:700;color:var(--warning);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:5px;margin-bottom:6px}
.private-note label svg{width:12px;height:12px;stroke:var(--warning)}
.private-note textarea{width:100%;background:transparent;font-size:.8125rem;color:var(--t1);resize:none;min-height:60px;line-height:1.5;border:none}
.private-note textarea::placeholder{color:var(--warning);opacity:.5}
/* Attachments grid */
.attach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.attach-item{aspect-ratio:1;border-radius:var(--r-md);background:var(--bg-input);overflow:hidden;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:20px}
.attach-item img{width:100%;height:100%;object-fit:cover}
.attach-count{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.875rem;font-weight:700;border-radius:var(--r-md)}
/* Timeline */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;position:relative}
.tl-item:not(:last-child) .tl-line{position:absolute;left:11px;top:24px;bottom:-8px;width:2px;background:var(--border)}
.tl-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--border);background:var(--bg-card);z-index:1;position:relative;margin-top:2px}
.tl-dot.active{border-color:var(--primary);background:var(--primary-alpha)}
.tl-dot.done{border-color:var(--success);background:var(--success-bg)}
.tl-dot svg{width:10px;height:10px}
.tl-content{flex:1;min-width:0;padding-bottom:16px}
.tl-title{font-size:.8125rem;font-weight:600;color:var(--t1)}
.tl-meta{font-size:.6875rem;color:var(--t3);margin-top:2px}
.tl-badge{display:inline-block;font-size:.5625rem;font-weight:700;padding:2px 7px;border-radius:var(--r-full);margin-top:4px}
/* Done summary */
.done-summary{background:var(--success-bg);border:1px solid rgba(52,211,153,.2);border-radius:var(--r-xl);padding:14px 16px;margin:0 18px 12px}
.done-sum-title{font-size:.6875rem;font-weight:700;color:var(--success);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.done-sum-title svg{width:13px;height:13px;stroke:var(--success)}
.done-sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.done-sum-item{text-align:center;background:rgba(52,211,153,.08);border-radius:var(--r-lg);padding:10px 8px}
.done-sum-val{font-size:1.25rem;font-weight:800;color:var(--t1)}
.done-sum-label{font-size:.6875rem;color:var(--t3);margin-top:2px}
/* Convert to customer section */
.convert-btn{width:100%;padding:10px;border-radius:var(--r-lg);background:var(--primary-alpha);border:1.5px solid rgba(3,157,145,.25);color:var(--primary);font-size:.8125rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all var(--tr-fast)}
.convert-btn:hover{background:var(--primary);color:#fff}
.convert-btn svg{width:15px;height:15px}

/* ── THEME TOGGLE ─────────────────────────────────── */
.theme-toggle{position:fixed;top:14px;right:16px;z-index:999;width:34px;height:34px;border-radius:10px;background:var(--bg-input);border:1px solid var(--border);cursor:pointer;color:var(--t3);transition:all var(--tr-norm);display:flex;align-items:center;justify-content:center}
.theme-toggle:hover{background:var(--primary-alpha);color:var(--primary)}
.theme-toggle svg{width:15px;height:15px}
[data-theme="dark"] .icon-sun{display:none}
[data-theme="light"] .icon-moon{display:none}

/* ── MODAL ────────────────────────────────────────── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-backdrop.show{display:flex}
.modal{background:var(--bg-card);border-radius:var(--r-2xl);width:480px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:fadeIn .2s}
.modal-head{padding:20px 22px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-head h3{font-size:1rem;font-weight:700;color:var(--t1)}
.modal-close{width:28px;height:28px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:var(--t3);transition:all var(--tr-fast)}
.modal-close:hover{background:var(--bg-hover);color:var(--t1)}
.modal-close svg{width:15px;height:15px}
.modal-body{padding:20px 22px;overflow-y:auto}
</style>
</head>

function formatTime(date) {
  const now = TODAY;
  const d = new Date(date);
  const diffMs = now - d;
  const diffDays = Math.floor(diffMs / 86400000);
  const nowYear = now.getFullYear(), dYear = d.getFullYear();
  const nowDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDaysFull = Math.floor((nowDay - dDay) / 86400000);

  if (diffDaysFull === 0) {
    // Today → show time
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  } else if (diffDaysFull <= 6) {
    // This week → show day name
    return ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'][d.getDay()];
  } else if (dYear === nowYear) {
    // This year → show day month
    const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return d.getDate() + ' ' + months[d.getMonth()];
  } else {
    // Different year → show day month year
    const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + dYear;
  }
}

// ── INTERACTIONS ──────────────────────────────────────
function selectChat(id) {
  activeId = id;
  const c = CHATS.find(x=>x.id===id);
  if(!c) return;
  renderChatList();
  renderChatMain(c);
  renderRightPanel(c);
}

function switchTab(el) {
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  currentTab = el.dataset.tab;
  renderChatList();
}

function handleSearch(input) {
  currentSearch = input.value.trim();
  const clearBtn = document.getElementById('searchClear');
  clearBtn.classList.toggle('show', currentSearch.length > 0);
  renderChatList();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  currentSearch = '';
  document.getElementById('searchClear').classList.remove('show');
  renderChatList();
}

function toggleFilter() {
  const drawer = document.getElementById('filterDrawer');
  const btn = document.getElementById('filterBtn');
  drawer.classList.toggle('open');
  btn.classList.toggle('active');
}

function toggleTheme() {
  const html = document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
}

function openModal(id) {
  const c = CHATS.find(x=>x.id===id);
  if(!c) return;
  document.getElementById('modalBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
      <div class="ci-av ${c.avColor}" style="width:56px;height:56px;border-radius:14px;font-size:22px">${c.name[0]}</div>
      <div>
        <div style="font-size:1.1rem;font-weight:700;color:var(--t1)">${c.name}</div>
        ${c.customName ? `<div style="font-size:.8125rem;color:var(--t3);margin-top:2px">ชื่อแพลตฟอร์ม: ${c.customName}</div>` : ''}
        <div style="font-size:.8125rem;color:var(--t3);margin-top:2px">${c.source} · ${statusLabel(c.status)}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><div style="font-size:.6875rem;color:var(--t3);margin-bottom:4px">เบอร์โทร</div><div style="font-size:.875rem;color:var(--t1)">${c.phone||'ไม่มีข้อมูล'}</div></div>
      <div><div style="font-size:.6875rem;color:var(--t3);margin-bottom:4px">อีเมล</div><div style="font-size:.875rem;color:var(--t1)">${c.email||'ไม่มีข้อมูล'}</div></div>
      <div><div style="font-size:.6875rem;color:var(--t3);margin-bottom:4px">ความสนใจ</div><div style="font-size:.875rem;color:var(--t1)">${c.interest||'ไม่มีข้อมูล'}</div></div>
      <div><div style="font-size:.6875rem;color:var(--t3);margin-bottom:4px">ประเภท</div><div style="font-size:.875rem;color:var(--t1)">${c.type==='company'?'บริษัท':'บุคคลทั่วไป'}</div></div>
    </div>
    ${c.tags&&c.tags.length ? `<div style="margin-top:16px"><div style="font-size:.6875rem;color:var(--t3);margin-bottom:8px">แท็ก</div><div class="tags-wrap">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>` : ''}`;
  document.getElementById('profileModal').classList.add('show');
}

function closeModal() {
  document.getElementById('profileModal').classList.remove('show');
}

// Update tab counts
function updateCounts() {
  const counts = {all:0,unassigned:0,new:0,inprogress:0,done:0};
  CHATS.forEach(c => { counts.all++; counts[c.status]++; });
  Object.entries(counts).forEach(([k,v]) => {
    const el = document.getElementById('cnt-'+k);
    if(el) el.textContent = v;
  });
}

// ── INIT ─────────────────────────────────────────────
updateCounts();
renderChatList();
selectChat(1);
</script>
</body>
</html>
